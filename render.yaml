services:
  - type: web
    name: api-reservas-deportivas
    runtime: docker
    rootDir: api-reservas-deportivas
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: publicado
      - key: CONFIAR_PROXY
        value: "true"
      - key: DB_PROVEEDOR
        value: supabase
      - key: ARCHIVOS_PROVEEDOR
        value: supabase
      - key: DB_SINCRONIZAR
        value: "true"
      - key: SEMBRAR_SI_VACIA
        value: "true"
      - key: NOTIFICACIONES
        value: registro
      - key: SIMULACION_HABILITADA
        value: "false"
      - key: DB_URL
        sync: false
      - key: JWT_SECRETO
        generateValue: true
      - key: SUPABASE_PROYECTO
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: archivos
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
